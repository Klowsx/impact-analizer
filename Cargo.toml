[workspace]
resolver = "2"
members = [
    "crates/laine-core",
    "crates/laine-ts",
    "crates/laine-py",
    "crates/laine-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/Klowsx/impact-analizer"

[workspace.dependencies]
clap = { version = "4.6.9", features = ["derive"] }
console = "0.15.11"
oxc_allocator = "0.160.0"
oxc_ast = "0.160.0"
oxc_ast_visit = "0.160.0"
oxc_parser = "0.160.0"
oxc_semantic = "0.160.0"
oxc_span = "0.160.0"
petgraph = "0.8.3"
rayon = "1.12.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
toml = "1.2.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
