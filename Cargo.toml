[workspace]
resolver = "2"
members = [
    "crates/faultline-core",
    "crates/faultline-ts",
    "crates/faultline-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Klowsx/impact-analizer"

[workspace.dependencies]
clap = { version = "4.6.9", features = ["derive"] }
oxc_allocator = "0.160.0"
oxc_parser = "0.160.0"
oxc_semantic = "0.160.0"
oxc_span = "0.160.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
toml = "1.2.2"
