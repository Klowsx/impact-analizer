name: "Laine Impact Analysis"
description: "Detect cross-repository breaking API contract changes with verifiable file/line evidence on Pull Requests"
author: "Javier Hernandez"

branding:
  icon: "git-pull-request"
  color: "orange"

inputs:
  config:
    description: "Path to the laine.toml workspace configuration file"
    required: false
    default: "laine.toml"
  repo:
    description: "Target service repository name (matching [[services]] in laine.toml)"
    required: true
  base:
    description: "Base Git revision (before change, e.g. origin/main or PR base SHA)"
    required: true
  head:
    description: "Head Git revision (after change)"
    required: false
    default: "HEAD"
  format:
    description: "Output report format: markdown, terminal, or json"
    required: false
    default: "markdown"
  comment-pr:
    description: "Post or update a Pull Request comment with the impact report"
    required: false
    default: "true"
  laine-version:
    description: "Laine release tag to download (e.g. v0.1.0), or 'source' to use PATH / build from source with Cargo"
    required: false
    default: "source"

outputs:
  exit-code:
    description: "Exit code returned by laine analyze (0 = compatible/pass, 2 = breaking change, 1 = error)"
    value: ${{ steps.run-laine.outputs.exit-code }}
  report-path:
    description: "Filesystem path to the generated Laine report"
    value: ${{ steps.run-laine.outputs.report-path }}

runs:
  using: "composite"
  steps:
    - name: Install or resolve Laine binary
      id: install-laine
      shell: bash
      env:
        LAINE_VERSION: ${{ inputs.laine-version }}
        ACTION_PATH: ${{ github.action_path }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail

        BINARY_NAME="laine"
        if [ "${RUNNER_OS}" = "Windows" ]; then
          BINARY_NAME="laine.exe"
        fi

        if [ "${LAINE_VERSION}" = "source" ]; then
          # Usa un binario preinstalado solo si soporta reportes sin descripciones.
          if existing="$(command -v laine)" &&
             help_output="$("${existing}" analyze --help 2>/dev/null)" &&
             [[ "${help_output}" == *"--no-snippets"* ]]; then
            echo "Using pre-installed laine: ${existing}"
            echo "binary-path=${existing}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! command -v cargo >/dev/null 2>&1; then
            echo "::error::No compatible laine binary or cargo was found on PATH. Install Rust or specify a release that supports --no-snippets."
            exit 1
          fi

          echo "Building laine from source at ${ACTION_PATH}..."
          cargo build --locked --release --manifest-path "${ACTION_PATH}/Cargo.toml" \
            --target-dir "${ACTION_PATH}/target" -p laine-cli --bin laine
          echo "${ACTION_PATH}/target/release" >> "${GITHUB_PATH}"
          echo "binary-path=${ACTION_PATH}/target/release/${BINARY_NAME}" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        case "${RUNNER_OS}:${RUNNER_ARCH}" in
          Linux:X64)
            TARGET="x86_64-unknown-linux-gnu"
            EXT="tar.gz"
            ;;
          macOS:ARM64)
            TARGET="aarch64-apple-darwin"
            EXT="tar.gz"
            ;;
          Windows:X64)
            TARGET="x86_64-pc-windows-msvc"
            EXT="zip"
            ;;
          *)
            echo "::error::Unsupported platform for prebuilt Laine binary: ${RUNNER_OS}/${RUNNER_ARCH}. Use laine-version: source instead."
            exit 1
            ;;
        esac

        ASSET="laine-${LAINE_VERSION}-${TARGET}.${EXT}"
        BASE_URL="https://github.com/Klowsx/impact-analizer/releases/download/${LAINE_VERSION}"
        DOWNLOAD_DIR="$(mktemp -d "${RUNNER_TEMP}/laine-release.XXXXXX")"
        BIN_DIR="${DOWNLOAD_DIR}/bin"
        ARCHIVE_PATH="${DOWNLOAD_DIR}/${ASSET}"
        CHECKSUM_PATH="${ARCHIVE_PATH}.sha256"

        # Descarga el archivo de suma exacto de esta versión y comprueba su formato.
        if ! curl -fsSL --retry 3 "${BASE_URL}/${ASSET}.sha256" -o "${CHECKSUM_PATH}"; then
          echo "::error::Unable to download the SHA-256 checksum for ${ASSET}."
          exit 1
        fi
        if ! IFS= read -r checksum_line < "${CHECKSUM_PATH}"; then
          echo "::error::Invalid SHA-256 checksum file for ${ASSET}."
          exit 1
        fi
        checksum_line="${checksum_line%$'\r'}"
        expected_hash="${checksum_line%% *}"
        if [[ ! "${expected_hash}" =~ ^[0-9A-Fa-f]{64}$ || "${checksum_line}" != "${expected_hash}  ${ASSET}" ]] ||
           ! { cmp -s "${CHECKSUM_PATH}" <(printf '%s\n' "${checksum_line}") ||
               cmp -s "${CHECKSUM_PATH}" <(printf '%s\r\n' "${checksum_line}"); }; then
          echo "::error::Invalid SHA-256 checksum file for ${ASSET}."
          exit 1
        fi

        echo "Downloading ${BASE_URL}/${ASSET}..."
        curl -fsSL --retry 3 "${BASE_URL}/${ASSET}" -o "${ARCHIVE_PATH}"

        # Verifica los bytes del archivo antes de instalar cualquier contenido.
        if command -v sha256sum >/dev/null 2>&1; then
          actual_hash="$(sha256sum -b < "${ARCHIVE_PATH}")"
        elif command -v shasum >/dev/null 2>&1; then
          actual_hash="$(shasum -a 256 -b < "${ARCHIVE_PATH}")"
        else
          echo "::error::A SHA-256 tool (sha256sum or shasum) is required to install Laine."
          exit 1
        fi
        expected_hash="$(printf '%s' "${expected_hash}" | LC_ALL=C tr 'A-F' 'a-f')"
        if [[ "${actual_hash%% *}" != "${expected_hash}" ]]; then
          echo "::error::SHA-256 mismatch for ${ASSET}."
          exit 1
        fi

        mkdir -p "${BIN_DIR}"
        if [ "${EXT}" = "tar.gz" ]; then
          tar -xzf "${ARCHIVE_PATH}" -C "${BIN_DIR}"
          chmod +x "${BIN_DIR}/laine"
        else
          unzip -oq "${ARCHIVE_PATH}" -d "${BIN_DIR}"
        fi

        echo "${BIN_DIR}" >> "${GITHUB_PATH}"
        echo "binary-path=${BIN_DIR}/${BINARY_NAME}" >> "${GITHUB_OUTPUT}"

    - name: Run Laine impact analysis
      id: run-laine
      shell: bash
      env:
        LAINE_BIN: ${{ steps.install-laine.outputs.binary-path }}
        LAINE_CONFIG: ${{ inputs.config }}
        LAINE_REPO: ${{ inputs.repo }}
        LAINE_BASE: ${{ inputs.base }}
        LAINE_HEAD: ${{ inputs.head }}
        LAINE_FORMAT: ${{ inputs.format }}
      run: |
        set -uo pipefail

        # Verifica que el binario pueda ocultar descripciones antes de publicar el reporte.
        if ! help_output="$("${LAINE_BIN}" analyze --help 2>/dev/null)" || [[ "${help_output}" != *"--no-snippets"* ]]; then
          echo "::error::This Action requires a Laine binary that supports --no-snippets. Use a compatible release or build it from source."
          exit 1
        fi

        REPORT_PATH="${RUNNER_TEMP}/laine-report.md"
        set +e
        "${LAINE_BIN}" analyze \
          --config "${LAINE_CONFIG}" \
          --repo "${LAINE_REPO}" \
          --base "${LAINE_BASE}" \
          --head "${LAINE_HEAD}" \
          --format "${LAINE_FORMAT}" \
          --no-snippets > "${REPORT_PATH}"
        EXIT_CODE=$?
        set -e

        cat "${REPORT_PATH}"
        echo "exit-code=${EXIT_CODE}" >> "${GITHUB_OUTPUT}"
        echo "report-path=${REPORT_PATH}" >> "${GITHUB_OUTPUT}"

    - name: Post or update Pull Request comment
      if: ${{ inputs.comment-pr == 'true' && github.event_name == 'pull_request' }}
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        REPORT_PATH: ${{ steps.run-laine.outputs.report-path }}
        LAINE_FORMAT: ${{ inputs.format }}
        LAINE_EXIT_CODE: ${{ steps.run-laine.outputs.exit-code }}
      with:
        script: |
          const fs = require("fs");
          const marker = "<!-- laine-impact-report -->";
          const reportPath = process.env.REPORT_PATH;
          const format = process.env.LAINE_FORMAT || "markdown";
          const exitCode = process.env.LAINE_EXIT_CODE || "0";

          let raw = "";
          if (reportPath && fs.existsSync(reportPath)) {
            raw = fs.readFileSync(reportPath, "utf8").trim();
          }

          if (!raw) {
            raw = `Laine exited with code \`${exitCode}\` and produced no report output.`;
          } else if (format === "json") {
            raw = "### Laine Cross-Repo Impact Analysis\n\n```json\n" + raw + "\n```";
          } else if (format === "terminal") {
            raw = "### Laine Cross-Repo Impact Analysis\n\n```text\n" + raw + "\n```";
          }

          const maxBodyLength = 65000;
          let body = `${marker}\n${raw}`;
          if (body.length > maxBodyLength) {
            body =
              body.slice(0, maxBodyLength - 120) +
              "\n\n---\n_Report truncated to fit GitHub's comment size limit._";
          }

          const { owner, repo } = context.repo;
          const issueNumber = context.issue.number;

          try {
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            // Actualiza únicamente el comentario del bot cuya primera línea es el marcador exacto.
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.user?.type === "Bot" &&
                comment.body?.split(/\r?\n/, 1)[0] === marker
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }
          } catch (error) {
            if (error.status === 403 || error.status === 404) {
              core.warning(`Could not publish the Laine report comment (HTTP ${error.status}). Check pull-requests permissions and access to the pull request.`);
            } else {
              throw error;
            }
          }

    - name: Propagate Laine exit code
      if: ${{ !cancelled() && steps.run-laine.outputs.exit-code != '' }}
      shell: bash
      env:
        LAINE_EXIT_CODE: ${{ steps.run-laine.outputs.exit-code }}
      run: |
        if [ "${LAINE_EXIT_CODE}" -ne 0 ]; then
          echo "Laine exited with status ${LAINE_EXIT_CODE}"
          exit "${LAINE_EXIT_CODE}"
        fi
